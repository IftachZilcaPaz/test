# Netlify: the Next.js app lives in app/. The Next.js runtime is detected automatically.
[build]
  base = "app"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Turbopack's build cache records env values; Netlify keeps it privately between
  # builds and never publishes it. The published output itself is still scanned.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"

# Declared explicitly: with the app in a subfolder, auto-detection can skip it and
# Netlify then publishes .next as plain static files (404 on every page).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# The service worker must never be cached, or installed apps keep stale code.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Security-Policy = "default-src 'self'; script-src 'self'"
